services:

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_DATABASE: dataforge
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./Backend/Database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  backend:
    build: ./Backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ""
      DB_NAME: dataforge
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ML_SERVICE_URL: http://mlservice:8000
      JWT_SECRET: change_this_to_a_strong_secret
      UPLOAD_DIR: uploads
      MAX_FILE_SIZE: 52428800
      ALLOWED_FILE_TYPES: text/csv,application/vnd.ms-excel
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./Backend
    restart: unless-stopped
    command: node worker-start.js
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ""
      DB_NAME: dataforge
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ML_SERVICE_URL: http://mlservice:8000
      JWT_SECRET: change_this_to_a_strong_secret
      WORKER_CONCURRENCY: 2
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mlservice:
    build: ./MLService
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ml_artifacts:/app/app/artifacts

  frontend:
    build: ./Frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
  ml_artifacts:
